# Smithery configuration for Eleições 2026: Dados Públicos do TSE
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_eleicoes

name: eleicoes-mcp
displayName: "Eleições 2026: Dados Públicos do TSE"
description: >
  Boletins de urna, logs e divulgação oficial do TSE das eleições 2026 (1º e 2º turno), com hash e link de origem, para você consultar e conferir com o ChatGPT ou o Claude. Cobre o 1º e o 2º turno; sem turno indicado, o padrão é o 2º. Cada número vem com o arquivo do TSE, o link oficial e o SHA-256, sem opinião. Dado bruto do TSE organizado para consulta. Não constitui laudo nem análise oficial. Serviço independente, não é do TSE. Grátis.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/eleicoes-mcp
repository: https://github.com/mcp-dir/eleicoes-mcp

tags:
  - elections
  - brazil
  - tse
  - eleicoes
  - ballot-box
  - open-data
  - government
  - public-data
  - sha256

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_eleicoes

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_eleicoes/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
